[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-ai-reminder-bot"
version = "0.1.0"
description = "Discord scheduled posting and AI writing assistant bot"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "discord.py>=2.6,<3",
    "openai>=2.54,<2.55",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.14,<3",
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/discord_ai_reminder_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
