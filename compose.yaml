services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: discord_bot_dev
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
