services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: discord_bot_dev
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres_test:
    image: postgres:18.4-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_DB: discord_bot_test
      POSTGRES_USER: discord_bot_test
      POSTGRES_PASSWORD: discord_bot_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot_test -d discord_bot_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: "no"

volumes:
  postgres_data:
