name: Bug report
description: 再現可能な不具合を報告します
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        セキュリティ上の問題は公開Issueへ投稿せず、SECURITY.mdを確認してください。秘密情報、実利用者データ、実ID、未加工logを記載しないでください。
  - type: textarea
    id: problem
    attributes:
      label: 発生した問題
      description: 秘密情報を除き、何が起きたかを説明してください。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 匿名の合成データで再現できる最小手順を記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "例: Windows 11 / WSL2 Linux"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "例: 3.14.x"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 実行環境
      description: local、testなど。host名、接続先、IDは記載しないでください。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 必要最小限のログ
      description: 任意。秘密、本文、ID、URL、例外全文を除去した固定event名などに限定してください。
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: 確認事項
      options:
        - label: 既存Issueを検索しました。
          required: true
        - label: 秘密情報、個人情報、実利用者データ、実IDを除去しました。
          required: true
        - label: セキュリティ脆弱性の報告ではありません。
          required: true
