name: discord-ai-reminder-bot
services:
  postgres:
    image: "postgres@${PRODUCTION_POSTGRES_IMAGE_DIGEST:?set an immutable sha256 digest}"
    environment:
      POSTGRES_DB_FILE: /run/secrets/postgres_database
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
    secrets: [postgres_database, postgres_user, postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deployment/production/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_database)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    image: "${PRODUCTION_APP_IMAGE:?set an immutable application image digest}"
    profiles: ["migration"]
    env_file: ./deployment/production/production.env
    environment: {DATABASE_HOST: postgres, DATABASE_PORT: "5432"}
    secrets: [postgres_database, postgres_user, postgres_password]
    entrypoint: ["/usr/local/bin/app-entrypoint", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"
    mem_limit: 192m
    pids_limit: 64

  app:
    image: "${PRODUCTION_APP_IMAGE:?set an immutable application image digest}"
    env_file: ./deployment/production/production.env
    environment: {DATABASE_HOST: postgres, DATABASE_PORT: "5432"}
    secrets: [postgres_database, postgres_user, postgres_password, discord_bot_token]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    mem_limit: 448m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 128
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

secrets:
  postgres_database: {file: ./deployment/production/secrets/postgres-database}
  postgres_user: {file: ./deployment/production/secrets/postgres-user}
  postgres_password: {file: ./deployment/production/secrets/postgres-password}
  discord_bot_token: {file: ./deployment/production/secrets/discord-bot-token}
volumes:
  postgres_data:
